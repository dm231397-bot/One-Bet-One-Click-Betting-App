<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>💣 Mines Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background: radial-gradient(circle at top,#0b1220,#020617);
  color:white;
  text-align:center;
}

/* TOP BAR */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:rgba(17,24,39,0.95);
  z-index:1000;
}

.wallet{
  color:#22c55e;
  font-weight:bold;
}

/* SPACE */
.spacer{height:70px;}

/* PANEL */
.panel{
  margin:10px auto;
  width:92%;
  max-width:420px;
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:14px;
  backdrop-filter:blur(10px);
}

input,select{
  width:90%;
  padding:10px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:#111827;
  color:white;
}

button{
  padding:10px 14px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:active{transform:scale(0.96);}

/* GRID */
#grid{
  display:grid;
  grid-template-columns:repeat(5,65px);
  gap:10px;
  justify-content:center;
  margin-top:20px;
}

/* TILE */
.tile{
  width:65px;
  height:65px;
  perspective:600px;
  cursor:pointer;
}

.inner{
  width:100%;
  height:100%;
  background:#1f2937;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  transition:0.35s;
  transform-style:preserve-3d;
}

/* FLIP */
.tile.flipped .inner{
  transform:rotateY(180deg);
}

.safe{
  background:#22c55e;
  box-shadow:0 0 12px #22c55e;
}

.bomb{
  background:#ef4444;
  box-shadow:0 0 15px red;
}

#status{
  margin-top:10px;
  color:#facc15;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
  <button onclick="location.href='index.html'">⬅ Home</button>
  <div>💣 Mines Pro</div>
  <div class="wallet">₦<span id="wallet">1000</span></div>
</div>

<div class="spacer"></div>

<!-- PANEL -->
<div class="panel">

<input id="bet" placeholder="Bet amount">

<select id="minesCount">
  <option value="1">1 Mine</option>
  <option value="3">3 Mines</option>
  <option value="5">5 Mines</option>
  <option value="10">10 Mines</option>
</select>

<select id="risk">
  <option value="low">Low Risk</option>
  <option value="medium">Medium</option>
  <option value="high">High</option>
</select>

<button onclick="startGame()">Start Game</button>
<button onclick="cashout()">Cashout</button>

<h3>Multiplier: <span id="multi">x1.00</span></h3>
<div id="status">Place a bet to start</div>

</div>

<div id="grid"></div>

<script>
let wallet = parseInt(localStorage.getItem("wallet") || 1000);

let mines = [];
let bet = 0;
let gameActive = false;
let revealed = 0;
let multiplier = 1;
let cashed = false;

updateWallet();

/* WALLET */
function updateWallet(){
  document.getElementById("wallet").innerText = wallet;
  localStorage.setItem("wallet", wallet);
}

/* START */
function startGame(){

  bet = parseInt(document.getElementById("bet").value);

  if(!bet || bet > wallet){
    document.getElementById("status").innerText = "❌ Insufficient balance";
    return;
  }

  wallet -= bet;
  updateWallet();

  gameActive = true;
  cashed = false;
  revealed = 0;
  multiplier = 1;

  document.getElementById("multi").innerText = "x1.00";
  document.getElementById("status").innerText = "Game started!";

  createGrid();
  generateMines();
}

/* MINES */
function generateMines(){
  mines = [];
  let count = parseInt(document.getElementById("minesCount").value);

  while(mines.length < count){
    let r = Math.floor(Math.random()*25);
    if(!mines.includes(r)) mines.push(r);
  }
}

/* GRID */
function createGrid(){
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  for(let i=0;i<25;i++){
    let tile = document.createElement("div");
    tile.className = "tile";

    let inner = document.createElement("div");
    inner.className = "inner";
    inner.innerHTML = "⬜";

    tile.appendChild(inner);

    tile.onclick = ()=>reveal(tile, inner, i);

    grid.appendChild(tile);
  }
}

/* REVEAL */
function reveal(tile, inner, i){

  if(!gameActive || tile.classList.contains("flipped")) return;

  tile.classList.add("flipped");

  if(mines.includes(i)){
    inner.classList.add("bomb");
    inner.innerHTML = "💣";

    gameActive = false;
    bet = 0;

    document.getElementById("status").innerText = "💥 You lost!";
    return;
  }

  inner.classList.add("safe");
  inner.innerHTML = "💎";

  revealed++;

  multiplier += 0.25;
  document.getElementById("multi").innerText = "x" + multiplier.toFixed(2);
}

/* CASHOUT */
function cashout(){

  if(!gameActive){
    document.getElementById("status").innerText = "⚠️ Place a bet first";
    return;
  }

  if(cashed || bet <= 0){
    document.getElementById("status").innerText = "⚠️ Already cashed or no bet";
    return;
  }

  cashed = true;

  let win = Math.floor(bet * multiplier);

  wallet += win;
  updateWallet();

  gameActive = false;

  document.getElementById("status").innerText =
    "💰 Won ₦" + win;
}
</script>

</body>
</html>
