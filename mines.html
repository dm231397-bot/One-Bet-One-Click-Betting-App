<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>💣 Mines</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background: radial-gradient(circle at top,#0b1220,#020617);
  color:white;
  text-align:center;
  overflow-x:hidden;
}

/* TOP NAV ONLY */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:999;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 15px;
  background:rgba(17,24,39,0.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:#1f2937;
  color:white;
  cursor:pointer;
}

.wallet{
  color:#22c55e;
  font-weight:bold;
}

.spacer{ height:70px; }

/* PANEL */
.panel{
  margin:15px auto;
  width:92%;
  max-width:420px;
  background:rgba(255,255,255,0.05);
  padding:18px;
  border-radius:16px;
}

/* INPUTS */
input,select{
  width:92%;
  padding:10px;
  margin:6px;
  border:none;
  border-radius:10px;
  background:#111827;
  color:white;
}

/* BUTTONS */
button{
  padding:12px;
  margin:6px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,#22c55e,#16a34a);
}

button:active{ transform:scale(0.96); }

/* GRID */
#grid{
  display:grid;
  grid-template-columns:repeat(5,70px);
  gap:10px;
  justify-content:center;
  margin-top:20px;
}

/* TILE */
.tile{
  width:70px;
  height:70px;
  perspective:600px;
}

.inner{
  width:100%;
  height:100%;
  border-radius:12px;
  background:#1f2937;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  transition:0.4s;
}

.tile.flipped .inner{
  transform:rotateY(180deg);
}

.safe{
  background:#22c55e;
  box-shadow:0 0 15px #22c55e;
}

.bomb{
  background:#ef4444;
  box-shadow:0 0 20px red;
}
</style>
</head>

<body>

<div class="topbar">
  <button onclick="location.href='index.html'">⬅</button>
  <div>💣 Mines</div>
  <div class="wallet">₦<span id="wallet">0</span></div>
</div>

<div class="spacer"></div>

<div class="panel">

<input id="bet" placeholder="Bet ₦">

<select id="minesCount">
  <option value="1">1 Mine</option>
  <option value="2">2 Mines</option>
  <option value="3">3 Mines</option>
  <option value="4">4 Mines</option>
  <option value="5">5 Mines</option>
  <option value="6">6 Mines</option>
  <option value="7">7 Mines</option>
  <option value="8">8 Mines</option>
  <option value="9">9 Mines</option>
  <option value="10">10 Mines</option>
</select>

<select id="risk">
  <option value="low">Low</option>
  <option value="medium">Medium</option>
  <option value="high">High</option>
</select>

<button onclick="startGame()">Start</button>
<button onclick="cashout()">Cashout</button>

<h3>Multiplier: <span id="multi">x1.00</span></h3>

</div>

<div id="grid"></div>

<script>
/* ===== SHARED WALLET SYSTEM ===== */
function getWallet(){
  return parseInt(localStorage.getItem("wallet") || 1000);
}

function setWallet(value){
  localStorage.setItem("wallet", value);
  updateWallet();
}

function updateWallet(){
  document.getElementById("wallet").innerText = getWallet();
}

window.addEventListener("load", updateWallet);

/* ===== GAME ===== */
let gameActive = false;
let mines = [];
let bet = 0;
let multiplier = 1;

/* START */
function startGame(){

  let wallet = getWallet();
  bet = parseInt(document.getElementById("bet").value);
  let mineCount = parseInt(document.getElementById("minesCount").value);

  if(!bet || bet > wallet){
    alert("Insufficient balance");
    return;
  }

  wallet -= bet;
  setWallet(wallet);

  gameActive = true;
  multiplier = 1;

  mines = [];
  while(mines.length < mineCount){
    let r = Math.floor(Math.random()*25);
    if(!mines.includes(r)) mines.push(r);
  }

  createGrid();
}

/* GRID */
function createGrid(){
  grid.innerHTML = "";

  for(let i=0;i<25;i++){
    let t = document.createElement("div");
    t.className = "tile";

    let inner = document.createElement("div");
    inner.className = "inner";
    inner.innerHTML = "?";

    t.appendChild(inner);
    t.onclick = ()=>reveal(t, inner, i);

    grid.appendChild(t);
  }
}

/* REVEAL */
function reveal(t, inner, i){
  if(!gameActive || t.classList.contains("flipped")) return;

  t.classList.add("flipped");

  if(mines.includes(i)){
    inner.classList.add("bomb");
    inner.innerHTML = "💣";
    gameActive = false;
  }else{
    inner.classList.add("safe");
    inner.innerHTML = "💎";

    multiplier += 0.3;
    multi.innerText = "x" + multiplier.toFixed(2);
  }
}

/* CASHOUT */
function cashout(){
  if(!gameActive) return;

  let wallet = getWallet();
  let win = Math.floor(bet * multiplier);

  wallet += win;
  setWallet(wallet);

  alert("Won ₦" + win);

  gameActive = false;
}
</script>

</body>
</html>
